name: Test Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate JavaScript
        run: npm run validate

      - name: Smoke-test safe fixtures with the Action
        uses: ./
        with:
          path: fixtures/safe
          fail-on: warning
          report: /tmp/automation-workflow-guard-safe.json
          exclude: ''

      - name: Confirm vulnerable fixtures fail in CLI mode
        run: |
          if node bin/guard.js fixtures/vulnerable --fail-on error --report /tmp/vulnerable.json; then
            echo "Expected vulnerable fixtures to fail"
            exit 1
          fi
          test -s /tmp/vulnerable.json

      - name: Package the VS Code extension
        run: |
          cd vscode
          npx --yes @vscode/vsce@4.0.0 package --no-dependencies -o ../automation-workflow-guard-0.1.0.vsix
          test -s ../automation-workflow-guard-0.1.0.vsix

      - name: Verify VSIX includes both the extension host and shared scanner
        run: |
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('automation-workflow-guard-0.1.0.vsix') as archive:
              names = set(archive.namelist())
              required = {
                  'extension/extension.cjs',
                  'extension/dist/guard.mjs',
                  'extension/dist/scan-document.mjs',
                  'extension/README.md',
                  'extension/LICENSE',
                  'extension/package.json',
              }
              assert required.issubset(names), sorted(required - names)
              manifest = json.loads(archive.read('extension/package.json'))
              assert manifest['name'] == 'automation-workflow-guard'
              assert manifest['version'] == '0.1.0'
              assert manifest['main'] == './extension.cjs'
          PY

      - name: Upload installable VSIX preview
        uses: actions/upload-artifact@v4
        with:
          name: automation-workflow-guard-vscode-preview
          path: automation-workflow-guard-0.1.0.vsix
          if-no-files-found: error
